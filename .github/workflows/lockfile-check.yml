name: Vérification package-lock

on: [push, pull_request]

jobs:
  check-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # npm 11, comme Dependabot : npm 10 retire les métadonnées libc du lockfile
      - name: Installer npm 11
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Vérifier la synchronisation du lockfile
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json
        # Si le lock file est modifié, le job échoue et indique qu’il faut le mettre à jour

